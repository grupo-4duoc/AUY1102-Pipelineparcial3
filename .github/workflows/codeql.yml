# =======================================================
# LEGADO - Workflow original de la profesora.
# Su lógica (CodeQL) ahora vive en .github/workflows/security.yml,
# que se ejecuta dentro del pipeline principal (ci-docker.yml).
# Se deja solo con ejecución manual para no duplicar análisis.
# Actualizado: codeql-action v3 -> v4.
# =======================================================
name: "CodeQL (legado)"

on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # Categoría distinta a la de security.yml para no pisar sus resultados
          category: "/legado/language:${{ matrix.language }}"
