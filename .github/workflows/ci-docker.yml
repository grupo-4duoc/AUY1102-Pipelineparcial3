# =======================================================
# Pipeline CI/CD completo - AUY1102 Pipeline Parcial 3
# Parte 1 (Docker y pruebas): Abraham Ravelo
# Parte 2 (Calidad y seguridad + gates): Simon
#
# Flujo:
#   build-test ──> docker-scout ─┐
#   sonarcloud ──────────────────┤
#   snyk ────────────────────────┼──> publish (Docker Hub)
#   ghas (security.yml) ─────────┘
# Si cualquier job falla, "publish" NO se ejecuta.
# =======================================================
name: CI/CD Pipeline - Docker, Calidad y Seguridad

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -----------------------------------------------------
  # Parte 1: construir imagen de pruebas y ejecutar tests
  # -----------------------------------------------------
  build-test:
    name: Build y Pruebas en Contenedor
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: 3. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Construir imagen Docker para pruebas unitarias
        run: |
          echo "Construyendo imagen Docker con target 'test'..."
          docker build --target test -t auy1102-pipeline:test .

      - name: 5. Ejecutar pruebas unitarias DENTRO del contenedor Docker
        run: |
          echo "Ejecutando pruebas unitarias dentro del contenedor..."
          docker run --rm auy1102-pipeline:test npm run test:unit
          echo "Pruebas unitarias completadas exitosamente dentro del contenedor."

  # -----------------------------------------------------
  # SonarCloud: calidad de código + Quality Gate
  # -----------------------------------------------------
  sonarcloud:
    name: SonarCloud (Quality Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio (historial completo para Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Generar cobertura (coverage/lcov.info)
        run: npm run test:coverage

      - name: Análisis SonarCloud y espera del Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # -----------------------------------------------------
  # Snyk: vulnerabilidades en dependencias (SCA) y código (SAST)
  # -----------------------------------------------------
  snyk:
    name: Snyk (dependencias y código)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Snyk - escaneo de dependencias (snyk test)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high

      # Se ejecuta aunque el paso anterior falle, para ver ambos reportes.
      - name: Snyk - escaneo de código (snyk code test)
        if: ${{ !cancelled() }}
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high

  # -----------------------------------------------------
  # GitHub Advanced Security (workflow reutilizable)
  # CodeQL + Dependency Review + Escaneo de secretos
  # -----------------------------------------------------
  ghas:
    name: GHAS
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml

  # -----------------------------------------------------
  # Docker Scout: CVEs de la imagen de producción
  # -----------------------------------------------------
  docker-scout:
    name: Docker Scout (imagen production)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Scout exige una cuenta de Docker Hub autenticada
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagen target production (local, sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          push: false
          tags: auy1102-pipeline:scan

      - name: Escanear CVEs critical/high
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://auy1102-pipeline:scan
          only-severities: critical,high
          exit-code: true

  # -----------------------------------------------------
  # Publicación en Docker Hub: SOLO si todos los gates pasan
  # y SOLO en push a develop o ejecución manual (no en PR)
  # -----------------------------------------------------
  publish:
    name: Publicar en Docker Hub
    needs: [build-test, sonarcloud, snyk, ghas, docker-scout]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que existan los secrets de Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Faltan los secrets DOCKERHUB_USERNAME y/o DOCKERHUB_TOKEN."
            exit 1
          fi

      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar tags y metadatos de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/auy1102-pipeline
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Construir imagen production y publicar en Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
