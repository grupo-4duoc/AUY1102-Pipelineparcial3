version: 2
updates:
  # Dependencias de Node.js (package.json / package-lock.json)
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'daily'

  # Imagen base del Dockerfile (node:18-alpine)
  - package-ecosystem: 'docker'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'

  # Versiones de las actions usadas en .github/workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
